<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700" font-family="monospace">
  <rect width="1100" height="700" fill="#1a1a2e"/>
  <text x="550" y="32" text-anchor="middle" fill="#e0e0e0" font-size="18" font-weight="bold">GameDesk — Схема подключения</text>
  <text x="550" y="52" text-anchor="middle" fill="#888" font-size="12">NodeMCU ESP-32S (38 pin) ↔ TFT 2.8" ST7789V  +  5 тактовых кнопок</text>

  <!-- ═══ ESP32 BOARD ═══ -->
  <rect x="370" y="70" width="240" height="560" rx="10" fill="#0d2137" stroke="#2a5080" stroke-width="2"/>
  <text x="490" y="92" text-anchor="middle" fill="#4fc3f7" font-size="13" font-weight="bold">NodeMCU ESP-32S</text>
  <text x="490" y="106" text-anchor="middle" fill="#555" font-size="10">38 pin, V1.1</text>

  <!-- USB -->
  <rect x="455" y="610" width="70" height="18" rx="3" fill="#333" stroke="#555"/>
  <text x="490" y="623" text-anchor="middle" fill="#888" font-size="10">USB-C → ПК</text>

  <!-- LEFT PINS -->
  <text x="378" y="134" fill="#ef9a9a" font-size="10">3V3</text>
  <text x="378" y="154" fill="#aaa" font-size="10">EN</text>
  <text x="378" y="174" fill="#aaa" font-size="10">SVP/36</text>
  <text x="378" y="194" fill="#aaa" font-size="10">SVN/39</text>
  <text x="378" y="214" fill="#aaa" font-size="10">GPIO34</text>
  <text x="378" y="234" fill="#aaa" font-size="10">GPIO35</text>
  <text x="378" y="254" fill="#aaa" font-size="10">GPIO32 ↓</text>
  <text x="378" y="274" fill="#aaa" font-size="10">GPIO33</text>
  <text x="378" y="294" fill="#aaa" font-size="10">GPIO25</text>
  <text x="378" y="314" fill="#ce93d8" font-size="10" font-weight="bold">GPIO26 ←</text>
  <text x="378" y="334" fill="#ce93d8" font-size="10" font-weight="bold">GPIO27 →</text>
  <text x="378" y="354" fill="#ce93d8" font-size="10" font-weight="bold">GPIO14 ↑</text>
  <text x="378" y="374" fill="#555" font-size="10" text-decoration="line-through">GPIO12 ✗</text>
  <text x="378" y="394" fill="#90caf9" font-size="10">GND</text>
  <text x="378" y="414" fill="#f48fb1" font-size="10" font-weight="bold">GPIO13 ●</text>
  <text x="378" y="434" fill="#ff5252" font-size="10">SD2 !</text>
  <text x="378" y="454" fill="#ff5252" font-size="10">SD3 !</text>
  <text x="378" y="474" fill="#ff5252" font-size="10">CMD !</text>
  <text x="378" y="494" fill="#90caf9" font-size="10">5V</text>

  <!-- Left dots -->
  <circle cx="368" cy="131" r="4" fill="#ef9a9a"/>
  <circle cx="368" cy="151" r="4" fill="#555"/>
  <circle cx="368" cy="171" r="4" fill="#555"/>
  <circle cx="368" cy="191" r="4" fill="#555"/>
  <circle cx="368" cy="211" r="4" fill="#555"/>
  <circle cx="368" cy="231" r="4" fill="#555"/>
  <circle cx="368" cy="251" r="4" fill="#ce93d8"/>
  <circle cx="368" cy="271" r="4" fill="#555"/>
  <circle cx="368" cy="291" r="4" fill="#555"/>
  <circle cx="368" cy="311" r="4" fill="#ce93d8"/>
  <circle cx="368" cy="331" r="4" fill="#ce93d8"/>
  <circle cx="368" cy="351" r="4" fill="#ce93d8"/>
  <circle cx="368" cy="371" r="4" fill="#444" opacity="0.4"/>
  <circle cx="368" cy="391" r="4" fill="#90caf9"/>
  <circle cx="368" cy="411" r="5" fill="#f48fb1"/>
  <circle cx="368" cy="431" r="4" fill="#ff5252" opacity="0.5"/>
  <circle cx="368" cy="451" r="4" fill="#ff5252" opacity="0.5"/>
  <circle cx="368" cy="471" r="4" fill="#ff5252" opacity="0.5"/>
  <circle cx="368" cy="491" r="4" fill="#90caf9"/>

  <!-- RIGHT PINS -->
  <text x="532" y="134" text-anchor="end" fill="#90caf9" font-size="10">GND</text>
  <text x="532" y="154" text-anchor="end" fill="#ffe082" font-size="10">GPIO23 MOSI</text>
  <text x="532" y="174" text-anchor="end" fill="#aaa" font-size="10">GPIO22</text>
  <text x="532" y="194" text-anchor="end" fill="#aaa" font-size="10">TX/GPIO1</text>
  <text x="532" y="214" text-anchor="end" fill="#aaa" font-size="10">RX/GPIO3</text>
  <text x="532" y="234" text-anchor="end" fill="#81c784" font-size="10" font-weight="bold">GPIO21 LED</text>
  <text x="532" y="254" text-anchor="end" fill="#90caf9" font-size="10">GND</text>
  <text x="532" y="274" text-anchor="end" fill="#bcaaa4" font-size="10">GPIO19 MISO</text>
  <text x="532" y="294" text-anchor="end" fill="#bcaaa4" font-size="10">GPIO18 SCK</text>
  <text x="532" y="314" text-anchor="end" fill="#aaa" font-size="10">GPIO5</text>
  <text x="532" y="334" text-anchor="end" fill="#aaa" font-size="10">GPIO17</text>
  <text x="532" y="354" text-anchor="end" fill="#aaa" font-size="10">GPIO16</text>
  <text x="532" y="374" text-anchor="end" fill="#ce93d8" font-size="10" font-weight="bold">GPIO4 RST</text>
  <text x="532" y="394" text-anchor="end" fill="#aaa" font-size="10">GPIO0</text>
  <text x="532" y="414" text-anchor="end" fill="#80cbc4" font-size="10" font-weight="bold">GPIO2 DC</text>
  <text x="532" y="434" text-anchor="end" fill="#ffb74d" font-size="10" font-weight="bold">GPIO15 CS</text>
  <text x="532" y="454" text-anchor="end" fill="#ff5252" font-size="10">SD1 !</text>
  <text x="532" y="474" text-anchor="end" fill="#ff5252" font-size="10">SD0 !</text>
  <text x="532" y="494" text-anchor="end" fill="#ff5252" font-size="10">CLK !</text>

  <!-- Right dots -->
  <circle cx="542" cy="131" r="4" fill="#90caf9"/>
  <circle cx="542" cy="151" r="4" fill="#ffe082"/>
  <circle cx="542" cy="171" r="4" fill="#555"/>
  <circle cx="542" cy="191" r="4" fill="#555"/>
  <circle cx="542" cy="211" r="4" fill="#555"/>
  <circle cx="542" cy="231" r="4" fill="#81c784"/>
  <circle cx="542" cy="251" r="4" fill="#90caf9"/>
  <circle cx="542" cy="271" r="4" fill="#bcaaa4"/>
  <circle cx="542" cy="291" r="4" fill="#bcaaa4"/>
  <circle cx="542" cy="311" r="4" fill="#555"/>
  <circle cx="542" cy="331" r="4" fill="#555"/>
  <circle cx="542" cy="351" r="4" fill="#555"/>
  <circle cx="542" cy="371" r="4" fill="#ce93d8"/>
  <circle cx="542" cy="391" r="4" fill="#555"/>
  <circle cx="542" cy="411" r="4" fill="#80cbc4"/>
  <circle cx="542" cy="431" r="4" fill="#ffb74d"/>
  <circle cx="542" cy="451" r="4" fill="#ff5252" opacity="0.5"/>
  <circle cx="542" cy="471" r="4" fill="#ff5252" opacity="0.5"/>
  <circle cx="542" cy="491" r="4" fill="#ff5252" opacity="0.5"/>

  <!-- ═══ TFT DISPLAY ═══ -->
  <rect x="30" y="90" width="130" height="270" rx="8" fill="#0d1a0d" stroke="#2e7d32" stroke-width="2"/>
  <text x="95" y="110" text-anchor="middle" fill="#81c784" font-size="11" font-weight="bold">TFT Display</text>
  <text x="95" y="123" text-anchor="middle" fill="#81c784" font-size="9">ST7789V 320x240</text>

  <text x="130" y="148" text-anchor="end" fill="#ef9a9a" font-size="10">VCC</text>
  <text x="130" y="168" text-anchor="end" fill="#90caf9" font-size="10">GND</text>
  <text x="130" y="188" text-anchor="end" fill="#ffb74d" font-size="10">CS</text>
  <text x="130" y="208" text-anchor="end" fill="#ce93d8" font-size="10">RESET</text>
  <text x="130" y="228" text-anchor="end" fill="#80cbc4" font-size="10">DC</text>
  <text x="130" y="248" text-anchor="end" fill="#ffe082" font-size="10">SDI(MOSI)</text>
  <text x="130" y="268" text-anchor="end" fill="#bcaaa4" font-size="10">SCK</text>
  <text x="130" y="288" text-anchor="end" fill="#81c784" font-size="10">LED</text>
  <text x="130" y="308" text-anchor="end" fill="#bcaaa4" font-size="10">SDO(MISO)</text>
  <text x="130" y="328" text-anchor="end" fill="#444" font-size="10">T_* — не подкл.</text>

  <circle cx="140" cy="145" r="4" fill="#ef9a9a"/>
  <circle cx="140" cy="165" r="4" fill="#90caf9"/>
  <circle cx="140" cy="185" r="4" fill="#ffb74d"/>
  <circle cx="140" cy="205" r="4" fill="#ce93d8"/>
  <circle cx="140" cy="225" r="4" fill="#80cbc4"/>
  <circle cx="140" cy="245" r="4" fill="#ffe082"/>
  <circle cx="140" cy="265" r="4" fill="#bcaaa4"/>
  <circle cx="140" cy="285" r="4" fill="#81c784"/>
  <circle cx="140" cy="305" r="4" fill="#bcaaa4"/>
  <circle cx="140" cy="325" r="4" fill="#444"/>

  <!-- WIRES TFT → ESP32 -->
  <!-- VCC → 5V -->
  <polyline points="140,145 200,145 200,491 368,491" fill="none" stroke="#ef9a9a" stroke-width="1.5"/>
  <!-- GND дисплей → GND (правый верх) -->
  <polyline points="140,165 220,165 220,131 542,131" fill="none" stroke="#90caf9" stroke-width="1.5"/>
  <!-- CS → GPIO15 -->
  <polyline points="140,185 310,185 310,431 542,431" fill="none" stroke="#ffb74d" stroke-width="2"/>
  <!-- RESET → GPIO4 -->
  <polyline points="140,205 305,205 305,371 542,371" fill="none" stroke="#ce93d8" stroke-width="1.5"/>
  <!-- DC → GPIO2 -->
  <polyline points="140,225 300,225 300,411 542,411" fill="none" stroke="#80cbc4" stroke-width="1.5"/>
  <!-- MOSI → GPIO23 -->
  <polyline points="140,245 320,245 320,151 542,151" fill="none" stroke="#ffe082" stroke-width="1.5"/>
  <!-- SCK → GPIO18 -->
  <polyline points="140,265 315,265 315,291 542,291" fill="none" stroke="#bcaaa4" stroke-width="1.5"/>
  <!-- LED → GPIO21 -->
  <polyline points="140,285 325,285 325,231 542,231" fill="none" stroke="#81c784" stroke-width="1.5"/>
  <!-- MISO → GPIO19 (пунктир) -->
  <polyline points="140,305 330,305 330,271 542,271" fill="none" stroke="#bcaaa4" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- ═══ BUTTONS ═══ -->
  <rect x="700" y="90" width="370" height="490" rx="8" fill="#1a0d1a" stroke="#7b1fa2" stroke-width="2"/>
  <text x="885" y="112" text-anchor="middle" fill="#ce93d8" font-size="13" font-weight="bold">5 тактовых кнопок</text>
  <text x="885" y="128" text-anchor="middle" fill="#888" font-size="10">INPUT_PULLUP, подключение к GND</text>

  <!-- LEFT -->
  <rect x="720" y="145" width="80" height="35" rx="5" fill="#1a1a3a" stroke="#ce93d8" stroke-width="1.5"/>
  <text x="760" y="158" text-anchor="middle" fill="#ce93d8" font-size="11" font-weight="bold">LEFT</text>
  <text x="760" y="172" text-anchor="middle" fill="#888" font-size="9">GPIO26</text>
  <line x1="800" y1="162" x2="860" y2="162" stroke="#ce93d8" stroke-width="1.5"/>
  <text x="865" y="158" fill="#ce93d8" font-size="10">→ GPIO26</text>
  <line x1="800" y1="172" x2="860" y2="172" stroke="#90caf9" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="865" y="176" fill="#90caf9" font-size="10">→ GND</text>

  <!-- RIGHT -->
  <rect x="720" y="200" width="80" height="35" rx="5" fill="#1a1a3a" stroke="#ce93d8" stroke-width="1.5"/>
  <text x="760" y="213" text-anchor="middle" fill="#ce93d8" font-size="11" font-weight="bold">RIGHT</text>
  <text x="760" y="227" text-anchor="middle" fill="#888" font-size="9">GPIO27</text>
  <line x1="800" y1="217" x2="860" y2="217" stroke="#ce93d8" stroke-width="1.5"/>
  <text x="865" y="213" fill="#ce93d8" font-size="10">→ GPIO27</text>
  <line x1="800" y1="227" x2="860" y2="227" stroke="#90caf9" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="865" y="231" fill="#90caf9" font-size="10">→ GND</text>

  <!-- UP -->
  <rect x="720" y="255" width="80" height="35" rx="5" fill="#1a1a3a" stroke="#ce93d8" stroke-width="1.5"/>
  <text x="760" y="268" text-anchor="middle" fill="#ce93d8" font-size="11" font-weight="bold">UP</text>
  <text x="760" y="282" text-anchor="middle" fill="#888" font-size="9">GPIO14</text>
  <line x1="800" y1="272" x2="860" y2="272" stroke="#ce93d8" stroke-width="1.5"/>
  <text x="865" y="268" fill="#ce93d8" font-size="10">→ GPIO14</text>
  <line x1="800" y1="282" x2="860" y2="282" stroke="#90caf9" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="865" y="286" fill="#90caf9" font-size="10">→ GND</text>

  <!-- DOWN — GPIO32 (исправлено с GPIO12) -->
  <rect x="720" y="310" width="80" height="35" rx="5" fill="#1a1a3a" stroke="#ce93d8" stroke-width="2"/>
  <text x="760" y="323" text-anchor="middle" fill="#ce93d8" font-size="11" font-weight="bold">DOWN</text>
  <text x="760" y="337" text-anchor="middle" fill="#81c784" font-size="9">GPIO32 ✓</text>
  <line x1="800" y1="327" x2="860" y2="327" stroke="#ce93d8" stroke-width="1.5"/>
  <text x="865" y="323" fill="#ce93d8" font-size="10">→ GPIO32</text>
  <line x1="800" y1="337" x2="860" y2="337" stroke="#90caf9" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="865" y="341" fill="#90caf9" font-size="10">→ GND</text>
  <!-- Пометка исправления -->
  <rect x="862" y="344" width="92" height="14" rx="3" fill="#1a3a1a" stroke="#81c784" stroke-width="0.5"/>
  <text x="908" y="354" text-anchor="middle" fill="#81c784" font-size="8">был GPIO12 → исправлен</text>

  <!-- CENTER -->
  <rect x="720" y="375" width="80" height="40" rx="5" fill="#1a1a3a" stroke="#f48fb1" stroke-width="2"/>
  <text x="760" y="389" text-anchor="middle" fill="#f48fb1" font-size="11" font-weight="bold">CENTER</text>
  <text x="760" y="403" text-anchor="middle" fill="#888" font-size="9">GPIO13</text>
  <text x="760" y="412" text-anchor="middle" fill="#666" font-size="8">кор./долг.</text>
  <line x1="800" y1="390" x2="860" y2="390" stroke="#f48fb1" stroke-width="2"/>
  <text x="865" y="386" fill="#f48fb1" font-size="10">→ GPIO13</text>
  <line x1="800" y1="403" x2="860" y2="403" stroke="#90caf9" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="865" y="407" fill="#90caf9" font-size="10">→ GND</text>

  <!-- GND шина кнопок -->
  <line x1="720" y1="430" x2="1060" y2="430" stroke="#90caf9" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="885" y="445" text-anchor="middle" fill="#90caf9" font-size="9">Все GND кнопок → любой GND ESP32</text>

  <!-- Wires кнопки → ESP32 -->
  <!-- LEFT GPIO26 -->
  <polyline points="368,311 340,311 340,162 700,162" fill="none" stroke="#ce93d8" stroke-width="1.5"/>
  <!-- RIGHT GPIO27 -->
  <polyline points="368,331 346,331 346,217 700,217" fill="none" stroke="#ce93d8" stroke-width="1.5"/>
  <!-- UP GPIO14 -->
  <polyline points="368,351 353,351 353,272 700,272" fill="none" stroke="#ce93d8" stroke-width="1.5"/>
  <!-- DOWN GPIO32 (левый ряд, строка 7 сверху = 251) -->
  <polyline points="368,251 344,251 344,327 700,327" fill="none" stroke="#ce93d8" stroke-width="2"/>
  <!-- CENTER GPIO13 -->
  <polyline points="368,411 335,411 335,390 700,390" fill="none" stroke="#f48fb1" stroke-width="2"/>
  <!-- GND кнопок → GND ESP32 (левый ряд строка 14 = 391) -->
  <polyline points="700,430 57,430 57,391 368,391" fill="none" stroke="#90caf9" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- ═══ ЗАМЕЧАНИЯ ═══ -->
  <rect x="30" y="390" width="320" height="185" rx="8" fill="#0d1a0d" stroke="#2e7d32" stroke-width="1"/>
  <text x="190" y="408" text-anchor="middle" fill="#81c784" font-size="11" font-weight="bold">⚠ Важные замечания</text>
  <text x="42" y="425" fill="#e0e0e0" font-size="10">• VCC дисплея → 5V (НЕ 3V3).</text>
  <text x="42" y="439" fill="#888" font-size="10">  LDO на плате сам делает 3.3V для чипа.</text>
  <text x="42" y="455" fill="#e0e0e0" font-size="10">• Тачскрин XPT2046 не распаян (U1 пустой).</text>
  <text x="42" y="469" fill="#888" font-size="10">  Пины T_* — не подключать.</text>
  <text x="42" y="485" fill="#81c784" font-size="10">• DOWN = GPIO32 (безопасный пин).</text>
  <text x="42" y="499" fill="#81c784" font-size="10">  GPIO12 был boot-pin → заменён. Boot loop устранён.</text>
  <text x="42" y="515" fill="#e0e0e0" font-size="10">• Flash-пины (SD0-SD3, CLK, CMD) — не трогать!</text>
  <text x="42" y="529" fill="#ff5252" font-size="10">  Помечены ! на схеме.</text>
  <text x="42" y="545" fill="#ffd54f" font-size="10">• Board в Arduino IDE: "ESP32 Dev Module"</text>
  <text x="42" y="561" fill="#888" font-size="10">  Кнопки: INPUT_PULLUP, нажатие = LOW.</text>

  <!-- ТАБЛИЦА -->
  <rect x="30" y="585" width="320" height="90" rx="6" fill="#0a0a1a" stroke="#333"/>
  <text x="190" y="601" text-anchor="middle" fill="#e0e0e0" font-size="10" font-weight="bold">Кнопки — сводка</text>
  <text x="40" y="617" fill="#ce93d8" font-size="9">LEFT=GPIO26  RIGHT=GPIO27  UP=GPIO14</text>
  <text x="40" y="631" fill="#ce93d8" font-size="9">DOWN=GPIO32  CENTER=GPIO13</text>
  <text x="40" y="648" fill="#e0e0e0" font-size="9">Дисплей: CS=15 DC=2 RST=4 LED=21</text>
  <text x="40" y="662" fill="#e0e0e0" font-size="9">SPI: MOSI=23 SCK=18 MISO=19  VCC→5V</text>

  <!-- ЛЕГЕНДА -->
  <rect x="700" y="455" width="370" height="100" rx="6" fill="#0a0a1a" stroke="#333"/>
  <text x="885" y="472" text-anchor="middle" fill="#e0e0e0" font-size="10" font-weight="bold">Легенда</text>
  <circle cx="715" cy="487" r="4" fill="#ef9a9a"/><text x="724" y="491" fill="#aaa" font-size="9">Питание 5V</text>
  <circle cx="715" cy="503" r="4" fill="#90caf9"/><text x="724" y="507" fill="#aaa" font-size="9">GND</text>
  <circle cx="715" cy="519" r="4" fill="#ffb74d"/><text x="724" y="523" fill="#aaa" font-size="9">CS дисплея → GPIO15</text>
  <circle cx="815" cy="487" r="4" fill="#ce93d8"/><text x="824" y="491" fill="#aaa" font-size="9">Кнопки LEFT/RIGHT/UP/DOWN</text>
  <circle cx="815" cy="503" r="4" fill="#f48fb1"/><text x="824" y="507" fill="#aaa" font-size="9">CENTER (кор./долг. нажатие)</text>
  <line x1="808" y1="519" x2="826" y2="519" stroke="#bcaaa4" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="830" y="523" fill="#aaa" font-size="9">MISO (опционально)</text>
  <rect x="808" y="527" width="18" height="10" rx="2" fill="#1a3a1a" stroke="#81c784" stroke-width="0.5"/>
  <text x="817" y="535" text-anchor="middle" fill="#81c784" font-size="7">fix</text>
  <text x="830" y="537" fill="#81c784" font-size="9">Исправлено (был GPIO12)</text>
</svg>
